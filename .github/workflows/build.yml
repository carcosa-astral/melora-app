# Builds Melora and runs the tests on every push and pull request.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v7

      - name: Test
        run: cargo test --release --locked

      - name: Lint
        run: cargo clippy --release --locked -- -D warnings
