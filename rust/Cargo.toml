[package]
name = "melora"
version = "3.0.0-alpha.1"
edition = "2024"
description = "Melora, a portable music player (Rust rewrite, in progress)"
license = "MIT"
publish = false

[dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
lofty = "0.25.5"
raw-window-handle = "0.6"
rfd = "0.18.0"
rusqlite = { version = "0.43.0", features = ["bundled"] }
slint = { version = "1.18.1", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software", "accessibility", "raw-window-handle-06"] }

[build-dependencies]
slint-build = "1.18.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
