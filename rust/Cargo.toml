[package]
name = "melora"
version = "3.0.0"
edition = "2024"
description = "Melora, a minimal portable music player"
license = "MIT"
publish = false

# Melora.exe, as 2.x is called, so updating means replacing the same file.
[[bin]]
name = "Melora"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
lofty = "0.25.5"
md5 = "0.8.1"
notify = "8.2.2"
raw-window-handle = "0.6"
rfd = "0.18.0"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde_json = "1.0.154"
slint = { version = "1.18.1", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software", "accessibility", "raw-window-handle-06"] }
souvlaki = "0.9.3"
tray-icon = "0.26.1"
ureq = "3.5.2"

[build-dependencies]
slint-build = "1.18.1"
winresource = "0.1.34"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
